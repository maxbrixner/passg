[project]
name = "passg"
version = "0.1.0"
description = "A minimal password generator I wrote for personal use."
readme = "README.md"
authors = [
    { name = "Max Brixner", email = "max.brixner@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyperclip>=1.11.0",
    "typer>=0.27.2",
]

[project.scripts]
passg = "passg:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
